<svg xmlns="http://w3.org" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f4f4f4"/>
  
  <g transform="translate(200,200)">
    <!-- Central Hexagonal Clipping Mask to preserve sharp internal gaps -->
    <defs>
      <mask id="gap-mask">
        <!-- Everything white stays -->
        <rect x="-200" y="-200" width="400" height="400" fill="white" />
        <!-- Thin black lines create the precise gaps between blades -->
        <g stroke="black" stroke-width="4" stroke-linecap="round">
          <line x1="-150" y1="-86.6" x2="150" y2="-86.6" />
          <line x1="-150" y1="-86.6" x2="0" y2="173.2" />
          <line x1="150" y1="-86.6" x2="0" y2="173.2" />
          <line x1="150" y1="86.6" x2="-150" y2="86.6" />
          <line x1="150" y1="86.6" x2="0" y2="-173.2" />
          <line x1="-150" y1="86.6" x2="0" y2="-173.2" />
        </g>
      </mask>
    </defs>

    <!-- Main Outer Circle Silhouette -->
    <circle cx="0" cy="0" r="150" fill="black" mask="url(#gap-mask)" />
    
    <!-- Central White Hexagon Cutout -->
    <polygon points="
      0,-58 
      50.2,-29 
      50.2,29 
      0,58 
      -50.2,29 
      -50.2,-29" 
      fill="#f4f4f4" />
  </g>
</svg>
